<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <title>Exceptional — resolve the intersection</title>
  <desc>Separated line directions meet a central ellipse, a schematic nod to the exceptional projective line in the blow-up of the affine plane at a point.</desc>
  <g stroke-width="3.3" stroke-linecap="round"><path d="M13 25 37 40m22 16 24 15" stroke="#588573"/><path d="M13 71 37 56m22-16 24-15" stroke="#668fae"/><path d="M48 11v19m0 36v19" stroke="#8b79a7"/></g>
  <ellipse cx="48" cy="48" rx="17" ry="23" transform="rotate(35 48 48)" stroke="#588573" stroke-width="3.3"/>
  <g fill="#668fae"><circle cx="37" cy="40" r="3"/><circle cx="59" cy="56" r="3"/></g>
  <g fill="#8b79a7"><circle cx="37" cy="56" r="3"/><circle cx="59" cy="40" r="3"/></g>
</svg>
